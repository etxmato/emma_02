<h1>Why does the COMX show only 30K at PR MEM when the 32K RAM card is selected?</h1>

<p>
This is correct behaviour. The original 32K RAM card was never supported by BASIC. The extra memory can be used via machine code or expansion card commands. See the <a href="https://www.emma02.hobby-site.com/comx_32kram.html">32K RAM</a> and <a href="https://www.emma02.hobby-site.com/comx_expansion.html">Expansion Box</a> sections.
</p>
