<h1>When I select the 32K RAM card, the COMX still shows 30K at PR MEM</h1>

<p>
This is correct behaviour. The original 32K RAM card was never supported by BASIC. The extra memory can be used via machine code or expansion card commands. See also the <a href="https://www.emma02.hobby-site.com/comx_32kram.html">32K RAM</a> and <a href="https://www.emma02.hobby-site.com/comx_expansion.html">Expansion Box</a> pages for additional details.
</p>
