# icons
# Legacy XPM pixmap, kept as a fallback for environments that read /usr/share/pixmaps
# directly (Openbox/IceWM/Fluxbox menus). Fedora is NOT one of them for rendering: its
# XPM support lives in the optional gdk-pixbuf2-modules-extra package, so on a stock
# Fedora/GNOME install the desktop entry's Icon=emma02 resolves to this .xpm but
# gdk-pixbuf cannot decode it -> no icon in the menu. The hicolor PNGs below fix that
# and win over pixmaps in the icon-theme lookup on every distro.
Pipeline/emma02.xpm -> /usr/share/pixmaps
# hicolor icon-theme PNGs. Sources live under images_linux/hicolor/ (mirroring the install
# path, since both build scripts stage with `cp -a "$src" "$dst/"` and the basename must
# stay emma02.png). Generated from images/app.ico: 16/32/48/256 are its native frames,
# 24/64/128 are LANCZOS scalings of the 256 frame.
images_linux/hicolor/16x16/apps/emma02.png -> /usr/share/icons/hicolor/16x16/apps
images_linux/hicolor/24x24/apps/emma02.png -> /usr/share/icons/hicolor/24x24/apps
images_linux/hicolor/32x32/apps/emma02.png -> /usr/share/icons/hicolor/32x32/apps
images_linux/hicolor/48x48/apps/emma02.png -> /usr/share/icons/hicolor/48x48/apps
