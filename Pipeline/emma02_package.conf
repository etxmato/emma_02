# Emma 02 Linux package manifest — SINGLE SOURCE OF TRUTH
# Edit this file when preparing a new revision (e.g. 2.01 -> 2.02):
#   1. Bump VERSION below
#   2. Add/remove file lines as needed
# Scripts generate ubuntu .deb, rpm .spec and .dbp files from this list.
#
# Format:
#   KEY=VALUE lines set package metadata
#   "<repo-relative source> -> <install dir>" lines list payload files
#   Lines starting with # and blank lines are ignored
#   Binary is arch-dependent: {BIN} = Release (arm64) or Release_x86 (amd64)

PACKAGE=emma-02
VERSION=2.01
MAINTAINER=Marcel van Tongeren <marcel.v.tongeren@gmail.com>
HOMEPAGE=http://www.emma02.hobby-site.com
ARCH_AMD64=amd64
ARCH_ARM64=arm64
DEPENDS=libc6, libsdl1.2debian, libserialport0, libcurl4t64 | libcurl4 | libcurl3, libwxgtk3.2-1t64 | libwxgtk3.2-1, libwxbase3.2-1t64 | libwxbase3.2-1
# wxWidgets 3.0 variant (Ubuntu 20.04/22.04, which ship no wx 3.2). Select with --wx 3.0.
DEPENDS_WX30=libc6, libsdl1.2debian, libserialport0, libcurl3 | libcurl4 | libcurl4t64, libwxgtk3.0-gtk3-0v5 | libwxgtk3.0-0v5, libwxbase3.0-0v5 | libwxbase3.0-0
# RPM variants (--format rpm --distro fedora|suse). Fedora ships wx 3.2 only.
# openSUSE Leap 16 ships wx 3.2 (DEPENDS_RPM_SUSE); Leap 15 ships wx 3.1
# (DEPENDS_RPM_SUSE_WX31, selected with --wx 3.1 -> _wx31 artifact suffix).
# Runtime package names probed on the builders (2026-10-14, Fedora 41,
# Leap 16.0, Leap 15.6). Fedora: sdl12-compat/libcurl/libserialport + plain
# wxGTK/wxBase 3.2. openSUSE: libSDL-1_2-0/libcurl4/libserialport0 + the -suse
# ABI packages (libwx_gtk2u_core-suse16_0_0 + libwx_baseu-suse16_0_0 on Leap 16,
# libwx_gtk2u_core-suse5_0_0 + libwx_baseu-suse5_0_0 on Leap 15).
# rpmbuild also adds soname-level requires from the binary automatically; these
# names just pull the right packages for `dnf/zypper install ./<rpm>`.
LICENSE=2007-2025 Marcel van Tongeren, core based on RCS Elf Emulator copyright 2006 by Michael H Riley.
DEPENDS_RPM_FEDORA=glibc, libcurl, sdl12-compat, libserialport, wxGTK, wxBase
DEPENDS_RPM_SUSE=glibc, libcurl4, libSDL-1_2-0, libserialport0, libwx_gtk2u_core-suse16_0_0, libwx_baseu-suse16_0_0
DEPENDS_RPM_SUSE_WX31=glibc, libcurl4, libSDL-1_2-0, libserialport0, libwx_gtk2u_core-suse5_0_0, libwx_baseu-suse5_0_0
DESC_SHORT=Emma 02, the RCA 1802 Emulator
DESC_LONG=Emma 02 is emulating the CDP18S020 Evaluation Kit, COMX-35, COMiX-35, Cosmac Elf, Cosmac Elf 2000, Cosmac Microtutor I, Cosmac Microtutor II, Cosmac VIP, Cosmac VIP II, CT Payphone, Cidelsa Arcade Game Console, Conic (Apollo, Mustang, MPT-02 and M1200), Cosmicos - COSmac MIcro COmputer System, CyberVision 2001, EDUKIT, EFA-Datorn, ETI-660, FRED I, FRED II, FRED III, HEC1802, HUG1802, Infinite UC1800, JVIP, MSI/88e, Macbug, Membership Card, Netronics ELF II, Oscom Nano, PECOM 32, PECOM 64, PTC-701, Pico/Elf V2, Quest Super Elf, RCA APT VP4801, RCA COSMAC Computer Game System, RCA COSMAC Development System, RCA COSMAC Microboard Computer, RCA MicroDisk Development System MS2000, RCA Microboard Computer Development System, RCA Studio II, RCA Studio III, RCA Studio IV, RCA Video Coin Arcade Console, SBC1802, Studio 2020, System 00, Telmac 1800, Telmac 2000, Telmac TMC-600, VELF, VIP2K Membership Card, VIS1802, VP3000 Interactive Data Terminal, VT1802 and Visicom COM-100

